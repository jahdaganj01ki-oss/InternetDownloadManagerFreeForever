name: Build & Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build the Electron app on Windows ──────────────────────────────────────
  build-electron:
    name: Build Electron App (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint / syntax check
        run: node --check src/main/main.js src/main/download-engine.js src/main/download-manager.js src/main/api-server.js src/main/preload.js src/shared/constants.js src/shared/utils.js

      - name: Build (electron-builder) — Windows portable + installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable code-signing for now (no certificate)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdm-win-installer
          path: dist/*.exe
          if-no-files-found: warn

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdm-win-portable
          path: dist/*portable*.exe
          if-no-files-found: warn

  # ── Package Chrome extension ────────────────────────────────────────────────
  build-extension:
    name: Package Chrome Extension
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate manifest
        run: node -e "const m = require('./chrome-extension/manifest.json'); console.log('Manifest OK:', m.name, 'v' + m.version);"

      - name: Zip Chrome extension
        run: |
          cd chrome-extension
          zip -r ../fdm-chrome-extension.zip . --exclude "*.DS_Store" --exclude "__MACOSX/*"
          cd ..
          echo "Extension zip size: $(du -sh fdm-chrome-extension.zip)"

      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdm-chrome-extension
          path: fdm-chrome-extension.zip

  # ── Release: only on version tags ──────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-electron, build-extension]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List release assets
        run: find release-assets -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Free Download Manager ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.zip
          body: |
            ## Free Download Manager ${{ github.ref_name }}

            ### What's included
            | File | Description |
            |------|-------------|
            | `FreeDownloadManager-Setup-*.exe` | Windows installer (NSIS) |
            | `fdm-chrome-extension.zip` | Chrome extension — load unpacked in `chrome://extensions` |

            ### Installation
            1. **Desktop app**: Run the `.exe` installer, follow the wizard.
            2. **Chrome extension**:
               - Download and extract `fdm-chrome-extension.zip`
               - Open Chrome → `chrome://extensions` → enable **Developer mode**
               - Click **Load unpacked** → select the extracted folder

            ### Completely free, forever
            No trial. No registration. No ads. MIT licensed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
