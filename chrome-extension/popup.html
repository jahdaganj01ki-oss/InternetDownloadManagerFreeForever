<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Free Download Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px; min-height: 240px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px; background: #fff; color: #202124;
    }
    header {
      background: #1a73e8; color: #fff;
      padding: 12px 14px; display: flex; align-items: center; gap: 8px;
    }
    header h1 { font-size: 14px; font-weight: 700; flex: 1; }
    header .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #fbbc04; flex-shrink: 0;
    }
    header .status-dot.online { background: #34a853; }
    #url-section { padding: 12px 14px; border-bottom: 1px solid #eee; }
    #url-section label { display: block; font-size: 11px; color: #666; margin-bottom: 4px; }
    #url-input {
      width: 100%; padding: 6px 8px; border: 1px solid #dde1e7;
      border-radius: 5px; font-size: 12px; color: #202124;
    }
    #url-input:focus { outline: 2px solid #1a73e8; outline-offset: -1px; }
    #btn-download {
      margin-top: 7px; width: 100%; padding: 8px;
      background: #1a73e8; color: #fff; border: none; border-radius: 5px;
      font-size: 13px; font-weight: 700; cursor: pointer; transition: background .15s;
    }
    #btn-download:hover { background: #1558b0; }
    #btn-download:disabled { background: #aaa; cursor: default; }
    #active-section { padding: 10px 14px; }
    #active-section h2 { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #666; margin-bottom: 8px; }
    .dl-item { padding: 6px 0; border-bottom: 1px solid #f0f2f5; }
    .dl-item:last-child { border-bottom: none; }
    .dl-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dl-bar-wrap { height: 4px; background: #e8f0fe; border-radius: 2px; margin: 4px 0; overflow: hidden; }
    .dl-bar { height: 100%; background: #1a73e8; border-radius: 2px; }
    .dl-bar.complete { background: #34a853; }
    .dl-meta { font-size: 10px; color: #666; display: flex; gap: 8px; }
    #footer {
      padding: 8px 14px; border-top: 1px solid #eee;
      display: flex; gap: 6px; justify-content: flex-end;
    }
    .btn-sm {
      padding: 5px 10px; border: 1px solid #dde1e7; border-radius: 4px;
      background: #f7f8fa; font-size: 11px; cursor: pointer; color: #444;
      transition: background .12s;
    }
    .btn-sm:hover { background: #e8f0fe; color: #1a73e8; }
    #status-msg { padding: 8px 14px; font-size: 11px; color: #666; }
    .badge { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 10px; font-weight: 700; }
    .badge-dl { background: #e8f0fe; color: #1a73e8; }
    .badge-ok { background: #e6f4ea; color: #34a853; }
    .badge-err { background: #fce8e6; color: #d93025; }
    #toggle-row { padding: 6px 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #eee; font-size: 12px; }
    .toggle { position: relative; display: inline-block; width: 32px; height: 18px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #ccc; border-radius: 18px; cursor: pointer; transition: .2s; }
    .slider::before { content: ''; position: absolute; height: 12px; width: 12px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background: #1a73e8; }
    input:checked + .slider::before { transform: translateX(14px); }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon16.png" alt="" width="16" height="16" style="border-radius:3px"/>
    <h1>Free Download Manager</h1>
    <div class="status-dot" id="status-dot" title="Connecting…"></div>
  </header>

  <div id="toggle-row">
    <label class="toggle">
      <input type="checkbox" id="intercept-toggle" checked/>
      <span class="slider"></span>
    </label>
    <span>Intercept browser downloads</span>
  </div>

  <div id="url-section">
    <label for="url-input">Download URL</label>
    <input type="url" id="url-input" placeholder="https://example.com/file.zip" spellcheck="false"/>
    <button id="btn-download">Download with FDM</button>
  </div>

  <div id="status-msg">Checking connection to FDM…</div>

  <div id="active-section" hidden>
    <h2>Active Downloads</h2>
    <div id="active-list"></div>
  </div>

  <div id="footer">
    <button class="btn-sm" id="btn-open-app">Open FDM</button>
    <button class="btn-sm" id="btn-options">Options</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
